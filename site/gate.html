<!-- Shared email gate for the savings and funds tools. Built into both tools by site/build.py.
     Visitors see the first 5 results; the rest unlock after a free sign-up to the Kajabi form below.
     Unlock is remembered in the browser (localStorage) and can be forced with ?unlocked=1 (used in the welcome email). -->
<style>
.ng-tease{filter:blur(5px);pointer-events:none;user-select:none;-webkit-user-select:none}
.ng-tease.ng-t2{opacity:.6}.ng-tease.ng-t3{opacity:.3}
.ng-gate{position:relative;z-index:2;margin-top:-170px;padding-top:110px;background:linear-gradient(to bottom,rgba(255,251,247,0),var(--ng-bg,#fffbf7) 105px);font-family:Poppins,system-ui,sans-serif;color:#1e1e1e;text-align:center}
.ng-card{max-width:560px;margin:0 auto;background:#fff;border:2px solid #ff8e0f;border-radius:24px;padding:26px 26px 20px;box-shadow:0 18px 40px rgba(30,30,30,.10)}
.ng-eyebrow{margin:0 0 6px;color:#ff8e0f;font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.ng-h{font-family:'Playfair Display',Georgia,serif;font-size:28px;line-height:1.15;margin:0 0 8px;font-weight:700;color:#1e1e1e}
.ng-p{margin:0 auto 16px;font-size:14.5px;color:#6b6259;max-width:440px;line-height:1.5}
.ng-form{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.ng-form input{font-family:inherit;font-size:15px;border:2px solid #efe4d6;border-radius:999px;padding:12px 18px;outline:0;background:#fff;color:#1e1e1e;min-width:0;width:100%;box-sizing:border-box}
.ng-form input:focus{border-color:#ff8e0f}
.ng-form input.ng-bad{border-color:#c0392b}
.ng-form .ng-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.ng-form button{grid-column:1/-1;font-family:inherit;background:#ff8e0f;color:#fff;border:0;border-radius:999px;padding:14px 22px;font-size:15.5px;font-weight:600;cursor:pointer;transition:background .15s}
.ng-form button:hover{background:#e67800}
.ng-form button[disabled]{opacity:.7;cursor:default}
.ng-err{margin:10px 0 0;font-size:13px;color:#c0392b}
.ng-fine{margin:12px auto 0;font-size:11.5px;color:#8a8178;line-height:1.5;max-width:460px}
.ng-fine a{color:#8a8178;text-decoration:underline}
.ng-done{margin:14px 0 0;font-size:13.5px;color:#16804a;font-weight:500;text-align:center}
@media (max-width:640px){
  .ng-gate{margin-top:-140px;padding-top:90px}
  .ng-card{padding:22px 16px 16px;border-radius:20px}
  .ng-h{font-size:24px}
  .ng-form{grid-template-columns:1fr}
}
</style>
<script>
(function(){
  if (window.NisbaGate) return;
  var KEY = 'nisba_tools_unlocked';
  var FORM_ID = '2149770749'; // Kajabi form "Unlock Savings & Funds tables (site gate)"
  var VISIBLE = 5;
  var open = false, subs = [];
  try { open = localStorage.getItem(KEY) === '1'; } catch (e) {}
  if (/[?&]unlocked(=|&|$)/.test(location.search)) unlock();

  function unlock(){
    open = true;
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function html(tool, total, noun, sub){
    return '<div class="ng-gate" data-tool="' + esc(tool) + '"><div class="ng-card">' +
      '<p class="ng-eyebrow">Free with your email</p>' +
      '<h3 class="ng-h">See all ' + total + ' ' + esc(noun) + '</h3>' +
      '<p class="ng-p">' + sub + '</p>' +
      '<form class="ng-form" novalidate>' +
        '<input name="name" type="text" placeholder="First name" autocomplete="given-name" aria-label="First name">' +
        '<input name="email" type="email" placeholder="Email address" autocomplete="email" aria-label="Email address">' +
        '<input name="website_url" class="ng-hp" tabindex="-1" autocomplete="off" aria-hidden="true">' +
        '<button type="submit">Show me the full list</button>' +
      '</form>' +
      '<p class="ng-err" hidden></p>' +
      '<p class="ng-fine">We will email you when rates change, plus new halal funds and free Nisba guidance. Unsubscribe any time. <a href="/privacy-policy" target="_blank" rel="noopener">Privacy policy</a></p>' +
    '</div></div>';
  }

  function track(tool){
    try { if (window.gtag) window.gtag('event', 'generate_lead', { lead_source: 'tools_gate', tool: tool }); } catch (e) {}
    try { (window.dataLayer = window.dataLayer || []).push({ event: 'tools_unlock', tool: tool }); } catch (e) {}
  }

  function send(name, email){
    var token = document.querySelector('meta[name="csrf-token"]');
    if (!/nisba\.co\.uk$/.test(location.hostname) || !token) return Promise.resolve();
    var fd = new FormData();
    fd.append('authenticity_token', token.content);
    fd.append('website_url', '');
    fd.append('kjb_fk_checksum', '');
    try { fd.append('kjb_visitor_time_zone', Intl.DateTimeFormat().resolvedOptions().timeZone || ''); } catch (e) {}
    fd.append('thank_you_url', location.pathname);
    fd.append('form_submission[name]', name);
    fd.append('form_submission[email]', email);
    return fetch('/forms/' + FORM_ID + '/form_submissions', { method: 'POST', body: fd, credentials: 'same-origin' })
      .catch(function(){});
  }

  document.addEventListener('submit', function(e){
    var f = e.target;
    if (!f.classList || !f.classList.contains('ng-form')) return;
    e.preventDefault();
    var gate = f.closest('.ng-gate'), err = gate.querySelector('.ng-err');
    var el = f.elements, nm = el['name'], em = el['email'];
    var name = nm.value.trim(), email = em.value.trim();
    nm.classList.toggle('ng-bad', !name);
    var okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
    em.classList.toggle('ng-bad', !okEmail);
    if (!name || !okEmail){ err.textContent = !name ? 'Please add your first name.' : 'Please check your email address.'; err.hidden = false; return; }
    if (el['website_url'].value) return; // bot filled the hidden field
    err.hidden = true;
    var btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Unlocking…';
    var tool = gate.getAttribute('data-tool');
    send(name, email).then(function(){
      unlock(); track(tool);
      subs.forEach(function(cb){ try { cb(); } catch (x) {} });
    });
  });

  window.NisbaGate = {
    VISIBLE: VISIBLE,
    isOpen: function(){ return open; },
    onUnlock: function(cb){ subs.push(cb); },
    html: html
  };
})();
</script>
