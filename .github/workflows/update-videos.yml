name: Daily video check

on:
  schedule:
    - cron: "40 6 * * *"   # 6:40am UK in winter, 7:40am in summer; after the fund check
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh YouTube uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python videos/update_videos.py
      - name: Publish videos.json
        run: |
          git config user.name "nisba-rates bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/videos.json
          git commit -m "Videos checked $(date -u +%F)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Another update landed first, retrying ($i of 5)"; sleep $((i * 10))
          done
          exit 1
